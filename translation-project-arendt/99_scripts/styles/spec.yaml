# Style specification for DOCX Builder v2 (The Origins of Totalitarianism, VNCH)
# All measurements in cm/pt. Twips conversion handled by styles.py.
styles:
  # ---------------------------------------------------------------- Title block
  - id: ArendtBookTitle
    name: Arendt Book Title
    type: paragraph
    based_on: Normal
    font: Times New Roman
    size: 24
    bold: true
    color: "1A1A1A"
    align: center
    space_before_pt: 72
    space_after_pt: 6
    line_spacing: 1.15
    keep_with_next: true
    ui_priority: 10

  - id: Author
    name: Author
    type: paragraph
    based_on: Normal
    font: Times New Roman
    size: 12
    italic: true
    color: "333333"
    align: center
    space_after_pt: 24
    line_spacing: 1.0
    keep_with_next: true
    ui_priority: 15

  - id: PartHeading
    name: Part Heading
    type: paragraph
    based_on: Heading 1
    font: Times New Roman
    size: 18
    bold: true
    color: "1A1A1A"
    align: center
    space_before_pt: 48
    space_after_pt: 12
    line_spacing: 1.15
    keep_with_next: true
    ui_priority: 5

  - id: ChapterNumber
    name: Chapter Number
    type: paragraph
    based_on: Normal
    font: Times New Roman
    size: 14
    bold: true
    color: "555555"
    align: center
    space_after_pt: 6
    line_spacing: 1.0
    keep_with_next: true
    ui_priority: 20

  - id: ChapterTitle
    name: Chapter Title
    type: paragraph
    based_on: Heading 1
    font: Times New Roman
    size: 22
    bold: true
    color: "1A1A1A"
    align: center
    space_after_pt: 6
    line_spacing: 1.15
    keep_with_next: true
    ui_priority: 5

  # ---------------------------------------------------------------- Headings
  - id: SectionH1
    name: Section H1
    type: paragraph
    based_on: Heading 2
    font: Times New Roman
    size: 14
    bold: true
    color: "1A1A1A"
    align: left
    space_before_pt: 18
    space_after_pt: 6
    line_spacing: 1.15
    keep_with_next: true
    ui_priority: 10

  - id: SectionH2
    name: Section H2
    type: paragraph
    based_on: Heading 3
    font: Times New Roman
    size: 12.5
    bold: true
    color: "1A1A1A"
    align: left
    space_before_pt: 12
    space_after_pt: 6
    line_spacing: 1.15
    keep_with_next: true
    ui_priority: 15

  - id: SectionH3
    name: Section H3
    type: paragraph
    based_on: Heading 4
    font: Times New Roman
    size: 12
    italic: true
    color: "1A1A1A"
    align: left
    space_before_pt: 6
    space_after_pt: 6
    line_spacing: 1.15
    keep_with_next: true
    ui_priority: 20

  # ---------------------------------------------------------------- Body
  - id: BodyText
    name: Body Text
    type: paragraph
    based_on: Normal
    font: Times New Roman
    size: 12
    color: "1A1A1A"
    align: justify
    first_indent_cm: 1.27
    space_after_pt: 6
    line_spacing: 1.3
    keep_with_next: false
    widow_control: true
    ui_priority: 30

  - id: BodyTextFirst
    name: Body First Para
    type: paragraph
    based_on: BodyText
    first_indent_cm: 0.0
    ui_priority: 35

  - id: BlockQuote
    name: Block Quote
    type: paragraph
    based_on: Normal
    font: Times New Roman
    size: 11
    color: "1A1A1A"
    align: justify
    left_indent_cm: 1.5
    right_indent_cm: 1.5
    space_before_pt: 6
    space_after_pt: 6
    line_spacing: 1.2
    ui_priority: 25

  # ---------------------------------------------------------------- Footnotes
  - id: FootnoteText
    name: Footnote Text
    type: paragraph
    based_on: Normal
    font: Times New Roman
    size: 9
    color: "1A1A1A"
    align: justify
    left_indent_cm: 0.63
    hanging_cm: 0.63
    space_before_pt: 0
    space_after_pt: 0
    line_spacing: 1.15
    widow_control: true
    ui_priority: 99

  - id: FootnoteReference
    name: Footnote Reference
    type: character
    font: Times New Roman
    size: 9
    ui_priority: 99

  # ---------------------------------------------------------------- Back matter
  - id: Bibliography
    name: Bibliography
    type: paragraph
    based_on: Normal
    font: Times New Roman
    size: 11
    color: "1A1A1A"
    align: justify
    hanging_cm: 1.27
    space_before_pt: 0
    space_after_pt: 3
    line_spacing: 1.15
    ui_priority: 40

  - id: IndexEntry
    name: Index Entry
    type: paragraph
    based_on: Normal
    font: Times New Roman
    size: 10
    color: "1A1A1A"
    align: justify
    hanging_cm: 1.0
    space_before_pt: 0
    space_after_pt: 2
    line_spacing: 1.1
    ui_priority: 45

  # ---------------------------------------------------------------- TOC
  - id: TOC1
    name: TOC Level 1
    type: paragraph
    based_on: Normal
    font: Times New Roman
    size: 12
    bold: true
    align: left
    space_after_pt: 4
    line_spacing: 1.0
    ui_priority: 50

  - id: TOC2
    name: TOC Level 2
    type: paragraph
    based_on: Normal
    font: Times New Roman
    size: 11
    align: left
    left_indent_cm: 0.5
    space_after_pt: 2
    line_spacing: 1.0
    ui_priority: 55
